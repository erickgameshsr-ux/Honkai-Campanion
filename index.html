<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Honkai Companion</title>
<link rel="icon" type="image/png" href="assets/ICON.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <button id="burger" class="icon-btn" aria-label="Ouvrir le menu" aria-expanded="false">☰</button>
  <strong class="brand"><img class="logo" src="assets/ICON.png" alt="" width="32" height="32" onerror="this.style.display='none'">Honkai Companion</strong>
</header>
<div id="scrim" class="scrim"></div>
<aside id="sidebar" class="sidebar" aria-label="Navigation principale"></aside>
<main id="view" class="view" tabindex="-1"></main>

<dialog id="dlg-save">
  <h2>Sauvegarde</h2>
  <p class="muted">Exportez votre progression sous forme de texte, ou collez un code pour la restaurer.</p>
  <textarea id="save-text" rows="7" spellcheck="false"></textarea>
  <p id="save-msg" class="muted" role="status"></p>
  <div class="row">
    <button id="btn-export" class="btn">Exporter ma sauvegarde</button>
    <button id="btn-import" class="btn">Importer une sauvegarde</button>
    <button id="btn-close" class="btn ghost">Fermer</button>
  </div>
</dialog>

<!-- Données (à modifier à chaque patch) -->
<script src="data-accueil-veille.js"></script>
<script src="data-builds.js"></script>
<script src="data-taches.js"></script>
<script src="data-ressources.js"></script>
<script src="app.js"></script>
</body>
</html>
